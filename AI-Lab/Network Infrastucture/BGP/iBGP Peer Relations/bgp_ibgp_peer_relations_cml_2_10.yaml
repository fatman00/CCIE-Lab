lab:
  title: BGP iBGP Peer Relations
  description: CCIE-level iBGP peer relationship lab using IOSv routers
  notes: ''
  version: 0.0.5
  nodes:
    - id: n0
      label: R1
      node_definition: iosv
      x: -250
      y: -100
      configuration: |-
        hostname R1
        no ip domain lookup
        ip cef
        interface Loopback0
         description BGP_ROUTER_ID
         ip address 10.255.0.1 255.255.255.255
        interface GigabitEthernet0/0
         description TO_R2
         ip address 10.0.12.1 255.255.255.252
         no shutdown
        interface GigabitEthernet0/1
         description TO_R3
         ip address 10.0.13.1 255.255.255.252
         no shutdown
        interface GigabitEthernet0/2
         description TO_EDGE
         ip address 192.0.2.1 255.255.255.252
         no shutdown
        router ospf 1
         router-id 10.255.0.1
         passive-interface Loopback0
         network 10.0.12.0 0.0.0.3 area 0
         network 10.0.13.0 0.0.0.3 area 0
         network 10.255.0.1 0.0.0.0 area 0
        line con 0
         logging synchronous
         exec-timeout 0 0
        line vty 0 4
         logging synchronous
         exec-timeout 0 0
      interfaces:
        - id: i0
          label: GigabitEthernet0/0
          slot: 0
          type: physical
        - id: i1
          label: GigabitEthernet0/1
          slot: 1
          type: physical
        - id: i2
          label: GigabitEthernet0/2
          slot: 2
          type: physical
    - id: n1
      label: R2
      node_definition: iosv
      x: 0
      y: -200
      configuration: |-
        hostname R2
        no ip domain lookup
        ip cef
        interface Loopback0
         description BGP_ROUTER_ID
         ip address 10.255.0.2 255.255.255.255
        interface GigabitEthernet0/0
         description TO_R1
         ip address 10.0.12.2 255.255.255.252
         no shutdown
        interface GigabitEthernet0/1
         description TO_R4
         ip address 10.0.24.1 255.255.255.252
         no shutdown
        router ospf 1
         router-id 10.255.0.2
         passive-interface Loopback0
         network 10.0.12.0 0.0.0.3 area 0
         network 10.0.24.0 0.0.0.3 area 0
         network 10.255.0.2 0.0.0.0 area 0
        line con 0
         logging synchronous
         exec-timeout 0 0
        line vty 0 4
         logging synchronous
         exec-timeout 0 0
      interfaces:
        - id: i0
          label: GigabitEthernet0/0
          slot: 0
          type: physical
        - id: i1
          label: GigabitEthernet0/1
          slot: 1
          type: physical
    - id: n2
      label: R3
      node_definition: iosv
      x: 0
      y: 0
      configuration: |-
        hostname R3
        no ip domain lookup
        ip cef
        interface Loopback0
         description BGP_ROUTER_ID
         ip address 10.255.0.3 255.255.255.255
        interface GigabitEthernet0/0
         description TO_R1
         ip address 10.0.13.2 255.255.255.252
         no shutdown
        interface GigabitEthernet0/1
         description TO_R4
         ip address 10.0.34.1 255.255.255.252
         no shutdown
        router ospf 1
         router-id 10.255.0.3
         passive-interface Loopback0
         network 10.0.13.0 0.0.0.3 area 0
         network 10.0.34.0 0.0.0.3 area 0
         network 10.255.0.3 0.0.0.0 area 0
        line con 0
         logging synchronous
         exec-timeout 0 0
        line vty 0 4
         logging synchronous
         exec-timeout 0 0
      interfaces:
        - id: i0
          label: GigabitEthernet0/0
          slot: 0
          type: physical
        - id: i1
          label: GigabitEthernet0/1
          slot: 1
          type: physical
    - id: n3
      label: R4
      node_definition: iosv
      x: 250
      y: -100
      configuration: |-
        hostname R4
        no ip domain lookup
        ip cef
        interface Loopback0
         description BGP_ROUTER_ID
         ip address 10.255.0.4 255.255.255.255
        interface Loopback44
         description INTERNAL_TEST_PREFIX
         ip address 10.44.44.44 255.255.255.255
        interface GigabitEthernet0/0
         description TO_R2
         ip address 10.0.24.2 255.255.255.252
         no shutdown
        interface GigabitEthernet0/1
         description TO_R3
         ip address 10.0.34.2 255.255.255.252
         no shutdown
        router ospf 1
         router-id 10.255.0.4
         passive-interface Loopback0
         passive-interface Loopback44
         network 10.0.24.0 0.0.0.3 area 0
         network 10.0.34.0 0.0.0.3 area 0
         network 10.255.0.4 0.0.0.0 area 0
        line con 0
         logging synchronous
         exec-timeout 0 0
        line vty 0 4
         logging synchronous
         exec-timeout 0 0
      interfaces:
        - id: i0
          label: GigabitEthernet0/0
          slot: 0
          type: physical
        - id: i1
          label: GigabitEthernet0/1
          slot: 1
          type: physical
    - id: n4
      label: EDGE
      node_definition: iosv
      x: -500
      y: -100
      configuration: |-
        hostname EDGE
        no ip domain lookup
        ip cef
        interface Loopback0
         description BGP_ROUTER_ID
         ip address 10.255.1.1 255.255.255.255
        interface Loopback100
         description EXTERNAL_PREFIX
         ip address 203.0.113.1 255.255.255.0
        interface GigabitEthernet0/0
         description TO_R1
         ip address 192.0.2.2 255.255.255.252
         no shutdown
        line con 0
         logging synchronous
         exec-timeout 0 0
        line vty 0 4
         logging synchronous
         exec-timeout 0 0
      interfaces:
        - id: i0
          label: GigabitEthernet0/0
          slot: 0
          type: physical
  links:
    - id: l0
      n1: n0
      i1: i0
      n2: n1
      i2: i0
      conditioning: {}
      label: R1-Gi0/0<->R2-Gi0/0
    - id: l1
      n1: n0
      i1: i1
      n2: n2
      i2: i0
      conditioning: {}
      label: R1-Gi0/1<->R3-Gi0/0
    - id: l2
      n1: n1
      i1: i1
      n2: n3
      i2: i0
      conditioning: {}
      label: R2-Gi0/1<->R4-Gi0/0
    - id: l3
      n1: n2
      i1: i1
      n2: n3
      i2: i1
      conditioning: {}
      label: R3-Gi0/1<->R4-Gi0/1
    - id: l4
      n1: n4
      i1: i0
      n2: n0
      i2: i2
      conditioning: {}
      label: EDGE-Gi0/0<->R1-Gi0/2
  annotations: []
